name: oidc-debug
on: workflow_dispatch
permissions:
  id-token: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: probe
        run: |
          echo "REQUEST_URL set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-NO}"
          echo "REQUEST_TOKEN set: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-NO}"
          dart --version
          echo "--- pub client OIDC support ---"
          dart pub publish --help 2>&1 | head -20
