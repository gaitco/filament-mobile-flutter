name: publish

# Tag-triggered pub.dev publish via OIDC trusted publishing — no long-lived
# credentials anywhere. pub.dev verifies the token against the package's
# configured publisher (repo + this workflow filename + tag pattern), set once
# in the package's pub.dev admin page. `dart pub publish` running inside
# GitHub Actions needs the token exchanged for it — see the publish step below.
#
# Lives inside the PACKAGE so `git archive HEAD dart/filament_mobile` carries
# it into the public mirror (`gaitco/filament-mobile-flutter`), where Actions
# minutes are free — the same note as ci.yml. The tag is pushed to the mirror
# by scripts/release.sh after the mirror CI on main is green.
on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # pub does NOT exchange the OIDC token itself. With only
      # ACTIONS_ID_TOKEN_REQUEST_* in the environment, `dart pub publish` finds
      # no credentials and falls back to the INTERACTIVE browser OAuth flow —
      # it prints an accounts.google.com URL and blocks on "Waiting for your
      # authorization..." until the job is cancelled. That is exactly how
      # v0.9.1's first attempt burned 18 minutes and published nothing. The
      # exchange below is the missing half: trade the Actions token for a
      # pub.dev one (audience https://pub.dev) and hand it over via PUB_TOKEN.
      - name: Authenticate to pub.dev via OIDC
        run: |
          token=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://pub.dev" \
            | jq -r '.value')
          echo "::add-mask::$token"
          echo "PUB_TOKEN=$token" >> "$GITHUB_ENV"
          dart pub token add https://pub.dev --env-var PUB_TOKEN
      # The tag/version match is enforced server-side by pub.dev's configured
      # tag pattern (v{{version}}) — a mismatched tag refuses to publish.
      - run: dart pub publish --force
