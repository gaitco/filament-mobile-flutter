name: filament_mobile_example
description: >
  A minimal host app for filament_mobile — implements FilamentTransport over
  package:http against a live Filament panel, and renders the package's
  stock screens with no styling of its own.
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  filament_mobile:
    path: ../
  # Hosted, not `path: ../../filament_mobile_charts`, because this example
  # ships inside the published archive: `path: ../` there resolves to the
  # archive root (this package), but a sibling path points outside it and
  # dangles, so `pub get` in a downloaded example would fail. For local work
  # against uncommitted charts source, add a gitignored
  # `pubspec_overrides.yaml`.
  filament_mobile_charts: ^0.1.0
  http: ^1.6.0
  # The P22 language choice persists per device; the package itself takes no
  # storage dependency, so persistence is host wiring — see main.dart.
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# Load-bearing, not redundant: the charts package depends on a *hosted*
# filament_mobile, and pub cannot satisfy that alongside this example's path
# dep on the same package without being told which wins. The local build does.
dependency_overrides:
  filament_mobile:
    path: ../

flutter:
  uses-material-design: true
